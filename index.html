<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Naruto Runner: Pixel Edition</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background-color: #2c1a1d; /* Koyu arka plan */
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Courier New', Courier, monospace; /* Pixel havası için */
            overflow: hidden;
            color: white;
        }

        /* --- GİRİŞ EKRANLARI --- */
        #soon-screen, #welcome-screen {
            position: absolute;
            text-align: center;
            z-index: 10;
        }
        
        #soon-screen h1 {
            font-size: 4rem;
            color: #ffcc00;
            text-shadow: 4px 4px 0 #000;
            letter-spacing: 2px;
        }
        #welcome-screen h1 {
            font-size: 4rem;
            color: #00ffcc;
            text-shadow: 4px 4px 0 #000;
        }

        /* --- OYUN ALANI --- */
        #game-container {
            display: none;
            position: relative;
            width: 100%;
            max-width: 800px;
            height: 350px;
            border: 4px solid #000;
            background: #e5989b; /* Gökyüzü rengi (Görseldeki gibi) */
            box-shadow: 0 10px 0 #000;
            overflow: hidden;
        }

        /* Katmanlı Dağlar (Arka Plan) */
        .mountains {
            position: absolute;
            bottom: 40px;
            width: 100%;
            height: 150px;
            background: #b56576; /* Dağ rengi */
            clip-path: polygon(0 100%, 15% 40%, 30% 100%, 45% 20%, 60% 100%, 75% 50%, 90% 100%, 100% 60%, 100% 100%);
            z-index: 1;
        }
        .mountains-2 {
            position: absolute;
            bottom: 40px;
            width: 100%;
            height: 100px;
            background: #6d597a; /* Ön dağ rengi */
            clip-path: polygon(0 100%, 20% 30%, 40% 100%, 60% 10%, 80% 100%, 100% 40%, 100% 100%);
            z-index: 2;
        }

        /* Zemin */
        #ground {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 40px;
            background: #2a9d8f; /* Çim rengi */
            border-top: 4px solid #000;
            border-bottom: 8px solid #5c3a21; /* Toprak rengi */
            z-index: 3;
        }

        /* --- NARUTO KARAKTERİ (PIXEL ART CSS) --- */
        #naruto {
            position: absolute;
            bottom: 40px; /* Zeminin üstünde */
            left: 50px;
            width: 40px;
            height: 50px;
            z-index: 10;
            image-rendering: pixelated; /* Keskin kenarlar için */
            transition: bottom 0.1s;
        }

        /* Kafa ve Saç */
        #naruto::before {
            content: '';
            position: absolute;
            top: 0;
            left: 5px;
            width: 30px;
            height: 25px;
            background: #ffdbac; /* Ten */
            border: 2px solid #000;
            border-radius: 4px;
            box-shadow: 
                -4px -4px 0 0 #ffcc00, /* Saç */
                4px -4px 0 0 #ffcc00,
                0 -6px 0 0 #ffcc00; 
        }

        /* Gövde (Turuncu Kıyafet) */
        #naruto::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 40px;
            height: 25px;
            background: #ff8c00; 
            border: 2px solid #000;
            border-radius: 4px;
        }

        /* Zıplama Sınıfı */
        .jump {
            animation: jumpAnim 0.6s ease-in-out;
        }

        @keyframes jumpAnim {
            0% { bottom: 40px; }
            50% { bottom: 150px; }
            100% { bottom: 40px; }
        }

        /* --- ENGELLER (Kuş/Shuriken) --- */
        .obstacle {
            position: absolute;
            width: 30px;
            height: 30px;
            background: #555;
            border: 3px solid #000;
            border-radius: 50%;
            box-shadow: 2px 2px 0 #000;
            z-index: 5;
            animation: moveObstacle 2s linear infinite;
        }
        
        .obstacle::after {
            content: '';
            position: absolute;
            top: 10px;
            left: 10px;
            width: 6px;
            height: 6px;
            background: #e5989b;
            border-radius: 50%;
        }

        @keyframes moveObstacle {
            0% { left: 100%; }
            100% { left: -50px; }
        }

        #score {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 1.5rem;
            font-weight: bold;
            color: #000;
            background: #ffcc00;
            padding: 5px 15px;
            border: 3px solid #000;
            z-index: 15;
        }

        #game-over {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            background: #2c1a1d;
            padding: 30px;
            border: 4px solid #ff0000;
            z-index: 20;
            box-shadow: 5px 5px 0 #000;
        }

        #game-over h2 { color: #ff0000; margin-bottom: 15px; font-size: 2rem; }
        #game-over button {
            padding: 10px 20px;
            background: #ffcc00;
            border: 3px solid #000;
            color: #000;
            font-weight: bold;
            cursor: pointer;
            font-size: 1rem;
            margin-top: 15px;
            box-shadow: 2px 2px 0 #000;
        }
        #game-over button:active {
            transform: translate(2px, 2px);
            box-shadow: none;
        }
    </style>
</head>
<body>

    <!-- GİRİŞ EKRANLARI -->
    <div id="soon-screen"><h1>SOON...</h1></div>
    <div id="welcome-screen" style="display:none;"><h1>WELCOME</h1></div>

    <!-- OYUN EKRANI -->
    <div id="game-container">
        <div class="mountains"></div>
        <div class="mountains-2"></div>
        <div id="ground"></div>
        
        <div id="score">0</div>
        <div id="naruto"></div>
        
        <div id="game-over">
            <h2>Oyun Bitti!</h2>
            <p id="final-score">Skor: 0</p>
            <button onclick="startGame()">Tekrar Oyna</button>
        </div>
    </div>

    <script>
        const soonScreen = document.getElementById('soon-screen');
        const welcomeScreen = document.getElementById('welcome-screen');
        const gameContainer = document.getElementById('game-container');
        const naruto = document.getElementById('naruto');
        const gameOverScreen = document.getElementById('game-over');
        const scoreDisplay = document.getElementById('score');
        const finalScoreDisplay = document.getElementById('final-score');

        let isJumping = false;
        let isGameOver = false;
        let score = 0;
        let gameInterval;
        let obstacleInterval;
        let currentObstacle = null;
        let obstacleSpeed = 2000; // Engel geçiş süresi

        // Giriş Animasyonları
        setTimeout(() => {
            soonScreen.style.display = 'none';
            welcomeScreen.style.display = 'block';
        }, 2000);

        setTimeout(() => {
            welcomeScreen.style.display = 'none';
            gameContainer.style.display = 'block';
            startGame();
        }, 4000);

        function jump() {
            if (isJumping || isGameOver) return;
            isJumping = true;
            naruto.classList.add('jump');
            
            setTimeout(() => {
                naruto.classList.remove('jump');
                isJumping = false;
            }, 600); 
        }

        function startGame() {
            clearInterval(gameInterval);
            clearInterval(obstacleInterval);
            if (currentObstacle) currentObstacle.remove();
            
            isGameOver = false;
            score = 0;
            scoreDisplay.innerText = score;
            gameOverScreen.style.display = 'none';
            obstacleSpeed = 2000;

            // Skor Sayacı
            gameInterval = setInterval(() => {
                if (!isGameOver) {
                    score += 10;
                    scoreDisplay.innerText = score;
                }
            }, 100);

            // Engel Oluşturucu
            spawnObstacle(); 
            obstacleInterval = setInterval(() => {
                if (!isGameOver) {
                    spawnObstacle();
                    // Oyun zorlaştıkça hızlansın
                    if (obstacleSpeed > 800) obstacleSpeed -= 50; 
                }
            }, 1500);
        }

        function spawnObstacle() {
            if (isGameOver) return;
            if (currentObstacle) return; // Tek seferde tek engel

            const obs = document.createElement('div');
            obs.classList.add('obstacle');
            
            // FARKLILIK: Rastgele yükseklik (Havada veya yerde)
            // Eğer Math.random() 0.5'ten büyükse havada uçan shuriken (kuş gibi)
            const isFlying = Math.random() > 0.5;
            if (isFlying) {
                obs.style.bottom = '100px'; // Havada
            } else {
                obs.style.bottom = '40px'; // Yerde
            }

            // Hızı uygula
            obs.style.animationDuration = `${obstacleSpeed}ms`;
            
            gameContainer.appendChild(obs);
            currentObstacle = obs;

            setTimeout(() => {
                if (obs.parentNode) obs.remove();
                if (currentObstacle === obs) currentObstacle = null;
            }, obstacleSpeed);
        }

        // Çarpışma Kontrolü
        setInterval(() => {
            if (isGameOver || !currentObstacle) return;

            const nRect = naruto.getBoundingClientRect();
            const oRect = currentObstacle.getBoundingClientRect();
            const cRect = gameContainer.getBoundingClientRect();

            const nX = nRect.left - cRect.left;
            const oX = oRect.left - cRect.left;
            
            // Naruto'nun yüksekliği (Zıplama kontrolü)
            const nY = nRect.top - cRect.top;
            const groundY = cRect.height - 40 - 50;

            // Çarpışma alanı (Biraz toleranslı)
            if (oX < nX + 30 && oX + 25 > nX + 5) {
                // Eğer Naruto yerdeyse VE Engel de yerdeyse VEYA
                // Naruto havadaysa VE Engel de havadaysa çarpışma olur.
                const obsBottom = currentObstacle.style.bottom;
                
                if (obsBottom === '40px' && nY > groundY - 20) {
                    gameOver(); // Yerdeki engele çarptı
                } else if (obsBottom === '100px' && nY < groundY - 50 && nY > groundY - 150) {
                    gameOver(); // Havadaki engele zıplarken çarptı
                }
            }
        }, 10);

        function gameOver() {
            isGameOver = true;
            clearInterval(gameInterval);
            clearInterval(obstacleInterval);
            finalScoreDisplay.innerText = "Skor: " + score;
            gameOverScreen.style.display = 'block';
            if (currentObstacle) currentObstacle.remove();
        }

        // Kontroller
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.code === 'ArrowUp') {
                e.preventDefault();
                jump();
            }
        });
        gameContainer.addEventListener('touchstart', (e) => {
            e.preventDefault();
            jump();
        });
        gameContainer.addEventListener('mousedown', (e) => {
            e.preventDefault();
            jump();
        });
    </script>
</body>
</html>
