<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soon...</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* Kırmızı/Siyah hareketli arka plan */
        .bg-animation {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg, #000000, #1a0000, #330000, #1a0000, #000000);
            background-size: 400% 400%;
            animation: gradientBG 10s ease infinite;
            z-index: 0;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            text-align: center;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        /* Soon yazısı ve kırmızı parlama efekti */
        .soon-text {
            font-size: 6rem;
            font-weight: 800;
            letter-spacing: 0.5rem;
            margin: 0;
            color: #ffffff;
            text-shadow: 0 0 10px #ff0000, 0 0 20px #ff0000, 0 0 40px #8b0000;
            animation: pulse 2s infinite alternate;
        }

        /* Parlama (Pulse) animasyonu */
        @keyframes pulse {
            0% { 
                transform: scale(1); 
                text-shadow: 0 0 10px #ff0000, 0 0 20px #ff0000; 
            }
            100% { 
                transform: scale(1.05); 
                text-shadow: 0 0 20px #ff0000, 0 0 40px #ff0000, 0 0 60px #ff0000; 
            }
        }

        /* Yükleniyor noktaları */
        .dots {
            display: flex;
            margin-top: 30px;
            gap: 15px;
        }

        .dot {
            width: 12px;
            height: 12px;
            background-color: #ff0000;
            border-radius: 50%;
            animation: blink 1.4s infinite both;
            box-shadow: 0 0 15px #ff0000;
        }

        .dot:nth-child(2) { animation-delay: 0.2s; }
        .dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes blink {
            0%, 80%, 100% { opacity: 0.1; transform: scale(0.8); }
            40% { opacity: 1; transform: scale(1.3); }
        }

        /* Mobil uyum */
        @media (max-width: 768px) {
            .soon-text {
                font-size: 4rem;
                letter-spacing: 0.3rem;
            }
        }
    </style>
</head>
<body>

    <!-- Hareketli Arka Plan -->
    <div class="bg-animation"></div>

    <!-- İçerik -->
    <div class="container">
        <h1 class="soon-text">SOON...</h1>
        <div class="dots">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>
    </div>

</body>
</html>
