<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ninja Runner</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background: #1a0b2e;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            color: white;
        }

        /* --- GİRİŞ EKRANI --- */
        #intro-screen {
            position: absolute;
            text-align: center;
            z-index: 50;
            background: rgba(0,0,0,0.8);
            padding: 40px;
            border-radius: 10px;
            border: 2px solid #ffcc00;
        }
        
        #intro-screen h1 {
            font-size: 4rem;
            color: #ffcc00;
            text-shadow: 4px 4px 0 #000;
            margin-bottom: 10px;
        }

        #intro-screen p {
            font-size: 1.2rem;
            color: #ccc;
            animation: blink 1s infinite;
        }

        @keyframes blink { 50% { opacity: 0.5; } }

        /* --- OYUN ALANI --- */
        #game-container {
            display: none;
            position: relative;
            width: 100%;
            max-width: 800px;
            height: 350px;
            border: 4px solid #000;
            background: #e5989b;
            box-shadow: 0 10px 0 #000;
            overflow: hidden;
        }

        /* Dağlar */
        .mountains {
            position: absolute;
            bottom: 40px;
            width: 100%;
            height: 150px;
            background: #b56576;
            clip-path: polygon(0 100%, 15% 40%, 30% 100%, 45% 20%, 60% 100%, 75% 50%, 90% 100%, 100% 60%, 100% 100%);
            z-index: 1;
        }
        .mountains-2 {
            position: absolute;
            bottom: 40px;
            width: 100%;
            height: 100px;
            background: #6d597a;
            clip-path: polygon(0 100%, 20% 30%, 40% 100%, 60% 10%, 80% 100%, 100% 40%, 100% 100%);
            z-index: 2;
        }

        /* Zemin */
        #ground {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 40px;
            background: #2a9d8f;
            border-top: 4px solid #000;
            border-bottom: 8px solid #5c3a21;
            z-index: 3;
        }

        /* --- SVG NINJA KARAKTERİ --- */
        #ninja {
            position: absolute;
            bottom: 40px;
            left: 50px;
            width: 50px;
            height: 60px;
            z-index: 10;
            transition: bottom 0.1s;
        }

        .jump {
            animation: jumpAnim 0.6s ease-in-out;
        }

        @keyframes jumpAnim {
            0% { bottom: 40px; }
            50% { bottom: 140px; }
            100% { bottom: 40px; }
        }

        /* --- ENGELLER --- */
        .obstacle {
            position: absolute;
            width: 30px;
            height: 30px;
            background: #333;
            border: 3px solid #000;
            border-radius: 50%; /* Shuriken */
            z-index: 5;
            animation: moveObstacle 2s linear infinite;
        }
        
        .obstacle::after {
            content: '';
            position: absolute;
            top: 8px;
            left: 8px;
            width: 8px;
            height: 8px;
            background: #e5989b;
            border-radius: 50%;
            border: 1px solid #000;
        }

        @keyframes moveObstacle {
            0% { left: 100%; }
            100% { left: -50px; }
        }

        #score {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 1.5rem;
            font-weight: bold;
            color: #000;
            background: #ffcc00;
            padding: 5px 15px;
            border: 3px solid #000;
            z-index: 15;
        }

        /* Oyun Bitti */
        #game-over {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            background: #2c1a1d;
            padding: 30px;
            border: 4px solid #ff0000;
            z-index: 20;
            box-shadow: 5px 5px 0 #000;
        }

        #game-over h2 { color: #ff0000; margin-bottom: 15px; font-size: 2rem; }
        #game-over button {
            padding: 10px 20px;
            background: #ffcc00;
            border: 3px solid #000;
            color: #000;
            font-weight: bold;
            cursor: pointer;
            font-size: 1rem;
            margin-top: 15px;
            box-shadow: 2px 2px 0 #000;
        }

    </style>
</head>
<body>

    <!-- GİRİŞ EKRANI -->
    <div id="intro-screen">
        <h1>WELCOME</h1>
        <p>Başlamak için tıkla veya Boşluk'a bas</p>
    </div>

    <!-- OYUN EKRANI -->
    <div id="game-container">
        <div class="mountains"></div>
        <div class="mountains-2"></div>
        <div id="ground"></div>
        
        <div id="score">0</div>
        
        <!-- SVG İLE ÇİZİLMİŞ NİNJA -->
        <div id="ninja">
            <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <!-- Kafa -->
                <circle cx="50" cy="40" r="20" fill="#ffdbac" stroke="#000" stroke-width="4"/>
                <!-- Saç/Bandana -->
                <path d="M30 30 Q50 10 70 30 L75 35 L25 35 Z" fill="#ff8c00" stroke="#000" stroke-width="3"/>
                <!-- Göz Bandı -->
                <rect x="30" y="35" width="40" height="10" fill="#333" />
                <!-- Gözler (Sadece biri açık) -->
                <circle cx="40" cy="42" r="3" fill="#fff" />
                <circle cx="60" cy="42" r="3" fill="#000" />
                <!-- Vücut (Turuncu) -->
                <rect x="30" y="60" width="40" height="30" fill="#ff8c00" stroke="#000" stroke-width="4" rx="5"/>
                <!-- Bacaklar -->
                <rect x="35" y="85" width="10" height="15" fill="#000" />
                <rect x="55" y="85" width="10" height="15" fill="#000" />
            </svg>
        </div>
        
        <div id="game-over">
            <h2>Oyun Bitti!</h2>
            <p id="final-score">Skor: 0</p>
            <button onclick="startGame()">Tekrar Oyna</button>
        </div>
    </div>

    <script>
        const introScreen = document.getElementById('intro-screen');
        const gameContainer = document.getElementById('game-container');
        const ninja = document.getElementById('ninja');
        const gameOverScreen = document.getElementById('game-over');
        const scoreDisplay = document.getElementById('score');
        const finalScoreDisplay = document.getElementById('final-score');

        let isJumping = false;
        let isGameOver = false;
        let score = 0;
        let gameInterval;
        let obstacleInterval;
        let currentObstacle = null;
        let obstacleSpeed = 2000;
        let gameStarted = false;

        // Başlatma Dinleyicileri
        function initGame() {
            if (gameStarted) return;
            gameStarted = true;
            introScreen.style.display = 'none';
            gameContainer.style.display = 'block';
            startGame();
        }

        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.code === 'ArrowUp') {
                e.preventDefault();
                if (!gameStarted) initGame();
                else jump();
            }
        });

        gameContainer.addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (!gameStarted) initGame();
            else jump();
        });
        
        gameContainer.addEventListener('mousedown', (e) => {
            e.preventDefault();
            if (!gameStarted) initGame();
            else jump();
        });

        function jump() {
            if (isJumping || isGameOver) return;
            isJumping = true;
            ninja.classList.add('jump');
            
            setTimeout(() => {
                ninja.classList.remove('jump');
                isJumping = false;
            }, 600); 
        }

        function startGame() {
            if (!gameStarted) return;
            clearInterval(gameInterval);
            clearInterval(obstacleInterval);
            if (currentObstacle) currentObstacle.remove();
            
            isGameOver = false;
            score = 0;
            scoreDisplay.innerText = score;
            gameOverScreen.style.display = 'none';
            obstacleSpeed = 2000;

            gameInterval = setInterval(() => {
                if (!isGameOver) {
                    score += 10;
                    scoreDisplay.innerText = score;
                }
            }, 100);

            spawnObstacle(); 
            obstacleInterval = setInterval(() => {
                if (!isGameOver) {
                    spawnObstacle();
                    if (obstacleSpeed > 800) obstacleSpeed -= 50; 
                }
            }, 1500);
        }

        function spawnObstacle() {
            if (isGameOver) return;
            if (currentObstacle) return; 

            const obs = document.createElement('div');
            obs.classList.add('obstacle');
            
            const isFlying = Math.random() > 0.5;
            if (isFlying) {
                obs.style.bottom = '120px'; 
            } else {
                obs.style.bottom = '40px'; 
            }

            obs.style.animationDuration = `${obstacleSpeed}ms`;
            gameContainer.appendChild(obs);
            currentObstacle = obs;

            setTimeout(() => {
                if (obs.parentNode) obs.remove();
                if (currentObstacle === obs) currentObstacle = null;
            }, obstacleSpeed);
        }

        setInterval(() => {
            if (isGameOver || !currentObstacle) return;

            const nRect = ninja.getBoundingClientRect();
            const oRect = currentObstacle.getBoundingClientRect();
            const cRect = gameContainer.getBoundingClientRect();

            const nX = nRect.left - cRect.left;
            const oX = oRect.left - cRect.left;
            const nY = nRect.top - cRect.top;
            const groundY = cRect.height - 40 - 60;

            if (oX < nX + 50 && oX + 30 > nX + 10) {
                const obsBottom = currentObstacle.style.bottom;
                
                if (obsBottom === '40px' && nY > groundY - 20) {
                    gameOver(); 
                } else if (obsBottom === '120px' && nY < groundY - 30 && nY > groundY - 130) {
                    gameOver(); 
                }
            }
        }, 10);

        function gameOver() {
            isGameOver = true;
            clearInterval(gameInterval);
            clearInterval(obstacleInterval);
            finalScoreDisplay.innerText = "Skor: " + score;
            gameOverScreen.style.display = 'block';
            if (currentObstacle) currentObstacle.remove();
        }
    </script>
</body>
</html>
