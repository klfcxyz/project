<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soon...</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            /* Karanlık ve gizemli bir arka plan */
            background: radial-gradient(circle at center, #1a1a24 0%, #000000 100%);
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* Arkadaki yıldız/parçacık efektleri için katman */
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        .container {
            text-align: center;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Soon yazısı ve Sharingan tarzı kırmızı/mor parlama efekti */
        .soon-text {
            font-size: 5rem;
            font-weight: 700;
            letter-spacing: 0.5rem;
            margin: 0;
            color: #ffffff;
            text-shadow: 0 0 10px #8b5cf6, 0 0 20px #8b5cf6, 0 0 40px #4c1d95;
            animation: breathe 3s ease-in-out infinite;
        }

        /* Nefes alma animasyonu */
        @keyframes breathe {
            0%, 100% { transform: scale(1); opacity: 0.8; text-shadow: 0 0 10px #8b5cf6, 0 0 20px #8b5cf6; }
            50% { transform: scale(1.05); opacity: 1; text-shadow: 0 0 15px #a78bfa, 0 0 30px #a78bfa, 0 0 50px #4c1d95; }
        }

        /* Yükleniyor noktaları */
        .dots {
            display: flex;
            margin-top: 20px;
            gap: 10px;
        }

        .dot {
            width: 10px;
            height: 10px;
            background-color: #a78bfa;
            border-radius: 50%;
            animation: blink 1.4s infinite both;
            box-shadow: 0 0 10px #a78bfa;
        }

        .dot:nth-child(2) { animation-delay: 0.2s; }
        .dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes blink {
            0%, 80%, 100% { opacity: 0.2; transform: scale(0.8); }
            40% { opacity: 1; transform: scale(1.2); }
        }

        @media (max-width: 600px) {
            .soon-text {
                font-size: 3rem;
                letter-spacing: 0.3rem;
            }
        }
    </style>
</head>
<body>

    <canvas id="stars"></canvas>

    <div class="container">
        <h1 class="soon-text">SOON...</h1>
        <div class="dots">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('stars');
        const ctx = canvas.getContext('2d');

        let width, height;
        let stars = [];

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }

        window.addEventListener('resize', resize);
        resize();

        class Star {
            constructor() {
                this.reset();
            }
            reset() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.size = Math.random() * 1.5;
                this.speedY = Math.random() * 0.5 + 0.1;
                this.opacity = Math.random();
                this.fadeSpeed = Math.random() * 0.02 + 0.005;
            }
            update() {
                this.y -= this.speedY;
                this.opacity += this.fadeSpeed;
                if (this.opacity > 1 || this.opacity < 0) {
                    this.fadeSpeed *= -1;
                }
                if (this.y < 0) {
                    this.y = height;
                    this.x = Math.random() * width;
                }
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity})`;
                ctx.fill();
            }
        }

        function initStars() {
            stars = [];
            for (let i = 0; i < 150; i++) {
                stars.push(new Star());
            }
        }

        function animate() {
            ctx.clearRect(0, 0, width, height);
            stars.forEach(star => {
                star.update();
                star.draw();
            });
            requestAnimationFrame(animate);
        }

        initStars();
        animate();
    </script>
</body>
  </html>
